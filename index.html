<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semart Pipel</title>

<style>
  :root {
    --cnn-red: #ff3333;
    --bg-dark: #0f172a;
    --bg-card: rgba(30, 41, 59, 0.7);
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
  }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
    background-attachment: fixed;
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* --- HEADER & NAV --- */
  header {
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 2px solid var(--cnn-red);
    padding: 15px 0;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo-box { border: 3px solid var(--cnn-red); padding: 2px 12px; display: inline-block; }
  .logo-text { font-weight: 900; font-size: 28px; color: white; }

  .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }

  .nav-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; overflow-x: auto; padding-bottom: 10px; }
  .nav-tabs button {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-secondary);
    padding: 8px 20px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
  }

  .nav-tabs button.active { background: var(--cnn-red); color: white; }

  /* --- NEWS GRID --- */
  #newsGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

  .card {
    background: var(--bg-card);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.3s;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .card:hover { transform: translateY(-5px); border-color: var(--cnn-red); }
  .card img { width: 100%; height: 180px; object-fit: cover; }
  .card-body { padding: 15px; }
  .card-title { font-weight: 700; line-height: 1.4; margin-bottom: 10px; }

  /* --- THE READER OVERLAY (The "Teleport" Fix) --- */
  #readerOverlay {
    position: fixed;
    inset: 0;
    background: var(--bg-dark);
    z-index: 2000;
    display: none; /* Hidden by default */
    overflow-y: auto;
    padding: 40px 20px;
    animation: slideUp 0.4s ease-out;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .reader-content { max-width: 800px; margin: auto; }
  .btn-close {
    position: sticky;
    top: 0;
    background: var(--cnn-red);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    margin-bottom: 20px;
  }

  .reader-img { width: 100%; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .reader-title { font-size: 32px; font-weight: 800; margin-bottom: 20px; line-height: 1.2; }
  .reader-text { font-size: 18px; line-height: 1.8; color: #cbd5e1; }
  .source-link { 
    display: inline-block; 
    margin-top: 30px; 
    color: var(--cnn-red); 
    text-decoration: none; 
    font-weight: bold;
    border: 1px solid var(--cnn-red);
    padding: 10px 20px;
    border-radius: 5px;
  }

  .loading { text-align: center; padding: 100px; color: var(--text-secondary); }
</style>
</head>
<body>

<header>
  <div class="logo-box"><span class="logo-text">SEMART</span></div>
  <div style="font-size: 10px; letter-spacing: 3px; color: #94a3b8;">PIPEL</div>
</header>

<div id="readerOverlay">
  <div class="reader-content">
    <button class="btn-close" onclick="closeReader()">✕ Back</button>
    <img id="r-img" class="reader-img" src="" alt="">
    <h1 id="r-title" class="reader-title"></h1>
    <div id="r-meta" style="margin-bottom: 20px; color: var(--text-secondary);"></div>
    <div id="r-content" class="reader-text"></div>
    <a id="r-link" href="" target="_blank" class="source-link">Baca Selengkapnya di CNN Indonesia →</a>
  </div>
</div>

<div class="container">
  <div class="nav-tabs">
    <button onclick="fetchNews('nasional')" id="btn-nasional" class="active">National</button>
    <button onclick="fetchNews('ekonomi')" id="btn-ekonomi">Economy</button>
    <button onclick="fetchNews('teknologi')" id="btn-teknologi">Technology</button>
    <button onclick="fetchNews('hiburan')" id="btn-hiburan">Enterteinment</button>
  </div>

  <div id="newsGrid"></div>
</div>

<script>
  let newsData = []; // To store fetched news temporarily

  async function fetchNews(category) {
    const grid = document.getElementById('newsGrid');
    document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-${category}`).classList.add('active');
    
    grid.innerHTML = '<div class="loading">📡 Mengambil berita terbaru...</div>';

    try {
      const rss = `https://www.cnnindonesia.com/${category}/rss`;
      const api = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rss)}`;
      const res = await fetch(api);
      const data = await res.json();

      newsData = data.items; // Save to memory
      grid.innerHTML = '';

      newsData.forEach((item, index) => {
        let imgUrl = item.thumbnail || (item.enclosure ? item.enclosure.link : '');
        if(!imgUrl) {
            const match = item.description.match(/src="([^"]+)"/);
            imgUrl = match ? match[1] : 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=800';
        }

        // Create Card UI
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openReader(index); // This replaces the teleport!
        card.innerHTML = `
          <img src="${imgUrl}" onerror="this.src='https://images.unsplash.com/photo-1585829365234-78d9b8129f50?w=800'">
          <div class="card-body">
            <div class="card-title">${item.title}</div>
            <div style="font-size:12px; color:var(--text-secondary)">🕒 ${new Date(item.pubDate).toLocaleDateString('id-ID')}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    } catch (e) {
      grid.innerHTML = '<div class="loading">⚠️ Gagal memuat data.</div>';
    }
  }

  // THE READER LOGIC
  function openReader(index) {
    const item = newsData[index];
    const overlay = document.getElementById('readerOverlay');
    
    // Fill the reader with data
    document.getElementById('r-title').innerText = item.title;
    document.getElementById('r-img').src = item.thumbnail || (item.enclosure ? item.enclosure.link : '');
    document.getElementById('r-meta').innerText = `Diterbitkan pada: ${item.pubDate} • CNN Indonesia`;
    
    // Clean the description HTML
    const cleanContent = item.description.replace(/<[^>]*>?/gm, '');
    document.getElementById('r-content').innerText = cleanContent;
    
    // Set the backup link
    document.getElementById('r-link').href = item.link;

    // Show the overlay
    overlay.style.display = 'block';
    document.body.style.overflow = 'hidden'; // Stop background scrolling
  }

  function closeReader() {
    document.getElementById('readerOverlay').style.display = 'none';
    document.body.style.overflow = 'auto'; // Re-enable scrolling
  }

  fetchNews('nasional');
</script>

</body>
</html>
